/* Prancheta — componentes. Classes com prefixo pr-. Todos os valores vêm dos tokens.
   O bloco :where() abaixo só vale quando tokens.css não foi carregado (especificidade zero):
   qualquer valor declarado em tokens.css vence. */
:where(html){--bg:#0b1210;--surface:#141d1a;--surface-2:#1d2925;--line:#2f3f39;--line-strong:#6a8077;--ink:#f4f6f1;--mut:#a7b6ae;--accent:#c6ff3d;--on-accent:#0b1210;--pitch:#1f9d55;--pitch-alt:#1a8a4a;--chalk:#f4f6f1;--boot:#0b1210;--gold:#ffc93c;--danger:#ff6b4a;--on-danger:#0b1210;--info:#5cc8ff;--home:#5cc8ff;--away:#ffa23a;--tier-bronze:#d1936a;--tier-silver:#cfd6da;--tier-gold:var(--gold);--tier-elite:var(--accent);--font-display:"Barlow Condensed","Arial Narrow",sans-serif;--font-body:Barlow,system-ui,sans-serif;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--radius-0:0px;--radius-sm:2px;--radius-pill:999px;--slant:-10deg;--cut:10px;--cut-lg:16px;--stroke-1:1px;--stroke-2:2px;--stroke-3:3px;--lift:0 8px 24px #00000066}
:where([data-theme="light"]){--bg:#f1f4ec;--surface:#ffffff;--surface-2:#e4e9df;--line:#cdd5cc;--line-strong:#6d7c74;--ink:#0b1210;--mut:#4a5a52;--accent:#0b6b33;--on-accent:#ffffff;--danger:#b92d14;--on-danger:#ffffff;--info:#075f9c;--home:#075f9c;--away:#a14e00}
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
.pr-stage{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font-body);padding:var(--space-4);min-height:100vh}
.pr-row{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center}
.pr-over{font:700 13px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:0}
.pr-num{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.pr-up{font-family:var(--font-display);font-style:italic;font-weight:800;text-transform:uppercase;line-height:1;margin:0}
:focus-visible{outline:var(--stroke-3) solid var(--ink);outline-offset:3px}

/* Button */
.pr-btn{display:inline-block;transform:skewX(var(--slant));border:var(--stroke-2) solid var(--accent);background:var(--accent);color:var(--on-accent);padding:var(--space-3) var(--space-6);cursor:pointer;font:italic 800 20px/1 var(--font-display);letter-spacing:.04em;text-transform:uppercase;border-radius:var(--radius-0)}
.pr-btn>span{display:block;transform:skewX(calc(var(--slant) * -1))}
.pr-btn:hover:not(:disabled){background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pr-btn--ghost{background:transparent;border-color:var(--line-strong);color:var(--ink)}
.pr-btn--danger{background:var(--danger);border-color:var(--danger);color:var(--on-danger)}
.pr-btn--sm{font-size:16px;padding:var(--space-2) var(--space-4)}
.pr-btn:disabled{opacity:.45;cursor:not-allowed}

/* RatingBadge */
.pr-ovr{display:inline-grid;place-items:center;align-content:center;gap:2px;width:64px;height:76px;background:var(--tier-silver);color:var(--boot);clip-path:polygon(var(--cut) 0,100% 0,100% 100%,0 100%,0 var(--cut))}
.pr-ovr b{font:700 40px/.9 var(--font-display);font-variant-numeric:tabular-nums}
.pr-ovr i{font:700 12px/1 var(--font-display);font-style:normal;letter-spacing:.1em}
.pr-ovr[data-tier="bronze"]{background:var(--tier-bronze)}
.pr-ovr[data-tier="ouro"]{background:var(--tier-gold)}
.pr-ovr[data-tier="elite"]{background:var(--tier-elite);color:var(--on-accent)}
.pr-ovr--sm{width:44px;height:52px}.pr-ovr--sm b{font-size:26px}.pr-ovr--sm i{display:none}

/* PlayerCard */
.pr-player{width:320px;max-width:100%;background:var(--surface);border:var(--stroke-1) solid var(--line);padding:var(--space-4);display:grid;gap:var(--space-4);clip-path:polygon(var(--cut) 0,100% 0,100% 100%,0 100%,0 var(--cut))}
.pr-player__top{display:flex;gap:var(--space-3);align-items:flex-end}
.pr-player__name{font-size:28px}
.pr-player__meta{display:flex;gap:var(--space-2);align-items:center;margin-top:var(--space-1);font:500 12px/1.35 var(--font-body);color:var(--mut)}
.pr-pos{font:700 13px/1 var(--font-display);letter-spacing:.08em;background:var(--ink);color:var(--bg);padding:3px 6px}
.pr-pot{color:var(--ink);font-weight:600}
.pr-skills{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2) var(--space-4)}
.pr-skill{display:grid;grid-template-columns:32px 1fr 22px;gap:var(--space-2);align-items:center;font:700 13px/1 var(--font-display);letter-spacing:.06em;color:var(--mut)}
.pr-skill u{display:block;height:6px;background:var(--surface-2);border-radius:var(--radius-sm);overflow:hidden;text-decoration:none}
.pr-skill u>s{display:block;height:100%;background:var(--ink)}
.pr-skill b{color:var(--ink);font-size:16px;text-align:right}

/* Pitch */
.pr-pitch{position:relative;width:280px;max-width:100%;aspect-ratio:2/3;background:repeating-linear-gradient(180deg,var(--pitch) 0 var(--space-5),var(--pitch-alt) var(--space-5) calc(var(--space-5) * 2));border:var(--stroke-2) solid var(--chalk);display:flex;flex-direction:column;justify-content:space-around;padding:var(--space-2) var(--space-1);overflow:hidden}
.pr-pitch::before{content:"";position:absolute;left:50%;top:-36px;width:72px;height:72px;margin-left:-36px;border:var(--stroke-2) solid var(--chalk);border-radius:var(--radius-pill)}
.pr-pitch::after{content:"";position:absolute;left:22%;right:22%;bottom:0;height:18%;border:var(--stroke-2) solid var(--chalk);border-bottom:0}
.pr-line{display:flex;justify-content:space-around;position:relative;z-index:1}
.pr-tok{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.pr-tok b{display:grid;place-items:center;width:34px;height:34px;border-radius:var(--radius-pill);background:var(--chalk);color:var(--boot);font:700 18px/1 var(--font-display)}
.pr-tok span{background:var(--boot);color:var(--chalk);font:700 12px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;padding:3px 5px;white-space:nowrap}
.pr-tok[data-oop] b{border-radius:var(--radius-0);transform:rotate(45deg);background:var(--boot);color:var(--chalk);outline:var(--stroke-2) solid var(--chalk)}
.pr-tok[data-oop]{gap:10px}
.pr-tok[data-oop] b>em{font-style:normal;transform:rotate(-45deg)}

/* Scorebug */
.pr-score{display:inline-flex;transform:skewX(var(--slant));box-shadow:var(--lift)}
.pr-score>*{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);background:var(--surface);color:var(--ink)}
.pr-score>*>*{transform:skewX(calc(var(--slant) * -1))}
.pr-score__team{font:italic 800 28px/1 var(--font-display);text-transform:uppercase;border-bottom:4px solid var(--home)}
.pr-score__team[data-side="fora"]{border-bottom-color:var(--away);border-bottom-style:double;border-bottom-width:6px}
.pr-score__team small{font:700 12px/1 var(--font-display);font-style:normal;letter-spacing:.1em;color:var(--mut)}
.pr-score__n{background:var(--chalk);color:var(--boot);font:700 40px/1 var(--font-display);font-variant-numeric:tabular-nums}
.pr-score__clock{background:var(--accent);color:var(--on-accent);font:700 24px/1 var(--font-display)}

/* FormGuide */
.pr-form{display:inline-flex;gap:var(--space-1)}
.pr-form i{display:grid;place-items:center;width:28px;height:28px;transform:skewX(var(--slant));font:700 16px/1 var(--font-display);font-style:normal;background:var(--surface-2);color:var(--ink);border:var(--stroke-2) solid var(--line-strong)}
.pr-form i[data-r="V"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pr-form i[data-r="D"]{background:var(--danger);border-color:var(--danger);color:var(--on-danger)}

/* LeagueTable */
.pr-table{color:var(--ink);border-collapse:collapse;width:100%;max-width:520px;font:500 14px/1.3 var(--font-body)}
.pr-table th{font:700 13px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);text-align:left;padding:var(--space-2) var(--space-3);border-bottom:var(--stroke-2) solid var(--line-strong)}
.pr-table td{padding:var(--space-2) var(--space-3);border-bottom:var(--stroke-1) solid var(--line)}
.pr-table .n{text-align:right;font:700 16px/1 var(--font-display);font-variant-numeric:tabular-nums}
.pr-table .pts{font-size:24px}
.pr-table .z{width:28px;font:700 14px/1 var(--font-display);color:var(--mut)}
.pr-table tr[data-zone="acesso"] .z{color:var(--info)}
.pr-table tr[data-zone="queda"] .z{color:var(--danger)}
.pr-table tr.pr-me td{background:var(--accent);color:var(--on-accent);border-bottom-color:var(--accent);font-weight:700}
.pr-table tr.pr-me .z{color:var(--on-accent)}

/* EventCard */
.pr-event{width:440px;max-width:100%;background:var(--surface);border:var(--stroke-1) solid var(--line);padding:var(--space-5);display:grid;gap:var(--space-3);clip-path:polygon(var(--cut-lg) 0,100% 0,100% 100%,0 100%,0 var(--cut-lg))}
.pr-event .pr-over{color:var(--accent)}
.pr-event h3{font-size:40px;line-height:.95}
.pr-event p{margin:0;color:var(--mut)}
.pr-choice{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);width:100%;text-align:left;background:var(--surface-2);color:var(--ink);border:var(--stroke-2) solid var(--line-strong);padding:var(--space-3);font:600 16px/1.3 var(--font-body);cursor:pointer;border-radius:var(--radius-0)}
.pr-choice:hover:not(:disabled){border-color:var(--ink)}
.pr-choice:disabled{opacity:.45;cursor:not-allowed}
.pr-choice__meta{display:flex;gap:var(--space-2);align-items:center;flex:none}
.pr-cost{background:var(--gold);color:var(--boot);font:700 16px/1 var(--font-display);padding:4px 8px;transform:skewX(var(--slant))}
.pr-risk{display:inline-flex;gap:3px;align-items:center;font:700 12px/1 var(--font-display);letter-spacing:.1em;color:var(--mut)}
.pr-risk i{width:8px;height:8px;border-radius:var(--radius-pill);border:var(--stroke-1) solid var(--line-strong)}
.pr-risk i.on{background:var(--ink);border-color:var(--ink)}

/* StatMeter */
.pr-meter{display:grid;gap:var(--space-1);min-width:140px}
.pr-meter__v{display:flex;align-items:baseline;gap:var(--space-2);font:700 40px/1 var(--font-display);font-variant-numeric:tabular-nums}
.pr-meter__v small{font:700 12px/1 var(--font-display);letter-spacing:.1em;color:var(--mut)}
.pr-meter__bar{display:flex;gap:var(--space-1);transform:skewX(var(--slant))}
.pr-meter__bar i{flex:1;height:10px;background:var(--surface-2);border-radius:var(--radius-sm)}
.pr-meter__bar i.on{background:var(--ink)}
.pr-meter[data-state="critico"] .pr-meter__v,.pr-meter[data-state="critico"] .pr-meter__v small{color:var(--danger)}
.pr-meter[data-state="critico"] .pr-meter__bar i.on{background:var(--danger)}

/* TransferOffer */
.pr-offer{width:440px;max-width:100%;background:var(--surface);border:var(--stroke-1) solid var(--line);padding:var(--space-5);display:grid;gap:var(--space-3);clip-path:polygon(var(--cut-lg) 0,100% 0,100% 100%,0 100%,0 var(--cut-lg))}
.pr-offer__head{display:flex;gap:var(--space-3);align-items:center}
.pr-offer__ask{margin-left:auto;text-align:right}
.pr-offer__ask b{display:block;font:700 24px/1 var(--font-display)}
.pr-chance{display:grid;grid-template-columns:72px 44px;gap:var(--space-2);align-items:center;font:700 16px/1 var(--font-display)}
.pr-chance u{display:block;height:8px;background:var(--bg);border-radius:var(--radius-sm);overflow:hidden}
.pr-chance u>s{display:block;height:100%;background:var(--ink)}

/* TacticPicker */
.pr-tactics{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.pr-tactic{position:relative;display:grid;grid-template-columns:40px auto;gap:2px var(--space-3);align-items:center;text-align:left;background:var(--surface);color:var(--ink);border:var(--stroke-2) solid var(--line-strong);padding:var(--space-5) var(--space-3) var(--space-3);cursor:pointer;border-radius:var(--radius-0)}
.pr-tactic svg{grid-row:1/3;width:40px;height:56px;background:var(--pitch)}
.pr-tactic svg circle{fill:var(--chalk)}
.pr-tactic b{font:700 24px/1 var(--font-display)}
.pr-tactic span{font:600 14px/1.3 var(--font-body);color:var(--mut)}
.pr-tactic[aria-pressed="true"]{border-color:var(--accent);outline:var(--stroke-2) solid var(--accent);outline-offset:-4px}
.pr-tactic[aria-pressed="true"]::after{content:"ATIVO";position:absolute;top:0;right:0;background:var(--accent);color:var(--on-accent);font:700 12px/1 var(--font-display);letter-spacing:.1em;padding:3px 6px}

/* Crest */
.pr-crest path.s{fill:var(--surface-2);stroke:var(--ink);stroke-width:3}
.pr-crest text{font:italic 800 22px var(--font-display);fill:#fff}

/* TabBar */
.pr-tabs{display:flex;gap:var(--space-1);background:var(--bg);border-top:var(--stroke-2) solid var(--line-strong);padding:var(--space-2)}
.pr-tabs button{flex:1;transform:skewX(var(--slant));background:var(--surface);color:var(--mut);border:0;border-bottom:4px solid var(--line);padding:var(--space-3) var(--space-2);font:italic 800 18px/1 var(--font-display);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border-radius:var(--radius-0)}
.pr-tabs button>span{display:block;transform:skewX(calc(var(--slant) * -1))}
.pr-tabs button[aria-current="page"]{background:var(--accent);color:var(--on-accent);border-bottom-color:var(--ink)}
:root,[data-theme="dark"]{--bg:#0b1210;--surface:#141d1a;--surface-2:#1d2925;--line:#2f3f39;--line-strong:#6a8077;--ink:#f4f6f1;--mut:#a7b6ae;--accent:#c6ff3d;--on-accent:#0b1210;--gold:#ffc93c;--danger:#ff6b4a;--on-danger:#0b1210;--info:#5cc8ff;--home:#5cc8ff;--away:#ffa23a;--pitch:#1f9d55;--pitch-alt:#1a8a4a;--chalk:#f4f6f1;--boot:#0b1210;--tier-bronze:#d1936a;--tier-silver:#cfd6da;--tier-gold:var(--gold);--tier-elite:var(--accent);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f4ec;--surface:#ffffff;--surface-2:#e4e9df;--line:#cdd5cc;--line-strong:#6d7c74;--ink:#0b1210;--mut:#4a5a52;--accent:#0b6b33;--on-accent:#ffffff;--danger:#b92d14;--on-danger:#ffffff;--info:#075f9c;--home:#075f9c;--away:#a14e00;color-scheme:light}}
[data-theme="light"]{--bg:#f1f4ec;--surface:#ffffff;--surface-2:#e4e9df;--line:#cdd5cc;--line-strong:#6d7c74;--ink:#0b1210;--mut:#4a5a52;--accent:#0b6b33;--on-accent:#ffffff;--danger:#b92d14;--on-danger:#ffffff;--info:#075f9c;--home:#075f9c;--away:#a14e00;color-scheme:light}
:root{--font-display:"Barlow Condensed","Arial Narrow",sans-serif;--font-body:Barlow,system-ui,sans-serif;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--radius-0:0px;--radius-sm:2px;--radius-pill:999px;--slant:-10deg;--cut:10px;--cut-lg:16px;--stroke-1:1px;--stroke-2:2px;--stroke-3:3px;--lift:0 8px 24px #00000066;--acc:var(--accent);--panel:var(--surface);--red:var(--danger);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font-body)}
.cutc{clip-path:polygon(var(--cut) 0,100% 0,100% 100%,0 100%,0 var(--cut))}
/* tipografia */
h1,h2,h3{font-family:var(--font-display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:0;margin:0;line-height:.95}
h1{font-weight:900;font-size:clamp(2.6rem,9vw,4rem)}h2{font-size:1.75rem}h3{font-size:1.1rem}
p{margin:.4em 0}.mut{color:var(--mut)}.red{color:var(--danger)}
b,em,.num,td.n,.stats b,.chip,.dot,.ov,.age,.tl,.badge{font-variant-numeric:tabular-nums}
.shirt{font:900 italic clamp(6rem,22vw,9rem)/.9 var(--font-display);color:transparent;-webkit-text-stroke:2px var(--ink);text-align:center;margin:8px 0 0;min-height:1em}
/* layout 3 colunas */
.wrap{max-width:1300px;margin:0 auto;padding:var(--space-5) var(--space-4) var(--space-7);display:grid;grid-template-columns:270px minmax(0,1fr) 320px;gap:var(--space-5);align-items:start}
main{grid-column:2;grid-row:1;min-width:0;width:100%;max-width:700px;justify-self:center}
#lp,#rp{position:sticky;top:calc(var(--hbh,0px) + 12px);min-width:0;max-height:calc(100vh - var(--hbh,0px) - 24px);overflow:auto;scrollbar-width:thin}
#lp{grid-column:1;grid-row:1}#rp{grid-column:3;grid-row:1}#lp[hidden],#rp[hidden]{display:none}
#lp>h2,#rp>h2{font-size:1.1rem;margin:0 0 var(--space-2);color:var(--mut);font-style:normal;font-family:var(--font-display);font-weight:700;letter-spacing:.12em;font-size:13px}
/* barra de status */
#hb{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:var(--stroke-1) solid var(--line);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 20px;padding:8px max(16px,calc((100% - 1268px)/2))}
.head{display:flex;gap:var(--space-4);align-items:center}
#hb .head{gap:12px;min-width:0}#hb .head svg{width:44px;height:44px;flex:none}#hb .head h2{font-size:1.5rem}#hb .head p{margin:0;font-size:.8rem;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-2);margin:14px 0}
.stats>div{background:var(--surface);clip-path:polygon(var(--cut) 0,100% 0,100% 100%,0 100%,0 var(--cut));padding:var(--space-2) var(--space-3);text-align:center}
.stats b{display:block;font:700 clamp(1.4rem,5vw,2rem)/1 var(--font-display)}
.stats span{font:700 11px/1.2 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
#hb .stats{margin:0;flex:1;min-width:250px;max-width:700px;gap:6px;grid-template-columns:1fr 1fr 1fr 2.6fr}#hb .stats>div{padding:4px 6px}#hb .stats b{font-size:clamp(1.15rem,4vw,1.6rem)}
.cash b{color:var(--ink)}.cash{text-align:center}
.bal{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;text-align:left;margin-top:2px}
.bal span{font:600 .68rem/1.3 var(--font-body)!important;letter-spacing:0!important;text-transform:none!important;white-space:nowrap}
.bal .ok{color:var(--accent);font-weight:700}.bal .red{color:var(--danger);font-weight:700}
/* botoes: inclinados, texto no eixo */
/* opcoes (cartoes retos) */
.opt{display:block;width:100%;text-align:left;margin-top:var(--space-2);background:var(--surface-2);color:var(--ink);padding:var(--space-3) var(--space-4);box-shadow:inset 0 0 0 var(--stroke-2) var(--line-strong);clip-path:polygon(var(--cut) 0,100% 0,100% 100%,0 100%,0 var(--cut));min-width:0}
.opt::before{display:none}
.opt:hover:not(:disabled){box-shadow:inset 0 0 0 var(--stroke-2) var(--ink)}
.opt.sel{box-shadow:inset 0 0 0 var(--stroke-3) var(--accent)}
.opt b{display:block;font-weight:700}.opt span{font-weight:400;color:var(--mut);font-size:.9rem}
.opt b.sb{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.opt .sb span{color:var(--ink);font:800 italic 1.35rem/1 var(--font-display);text-transform:uppercase}
.chip{font:700 1.25rem/1.25 var(--font-display);font-style:normal;background:var(--gold);color:var(--boot);padding:0 10px;white-space:nowrap;transform:skewX(var(--slant))}
.tac .chip{background:var(--ink);color:var(--bg)}
.seg{display:flex;gap:var(--space-2);margin:14px 0 2px}.seg button{flex:1;padding:10px 6px;font-size:.9rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:var(--space-2);margin-top:var(--space-2)}
.tac .ds{display:block;margin-top:2px}
.mbs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;margin-top:var(--space-2)}
.mb{display:grid;gap:3px;font:700 11px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.mb i{display:block;height:6px;border-radius:var(--radius-sm);background:var(--line);overflow:hidden;transform:skewX(var(--slant))}.mb u{display:block;height:100%;background:var(--ink)}
.ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:var(--space-2);font-size:.85rem;flex-wrap:wrap}.opt .ft b{display:inline}
.badge{background:var(--accent);color:var(--on-accent);font:700 11px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;padding:3px 8px}
.steps{display:flex;gap:4px;margin:14px 0 4px}.steps i{flex:1;height:6px;border-radius:var(--radius-sm);background:var(--line);transform:skewX(var(--slant))}.steps i.on{background:var(--accent)}
.tag{display:inline-block;background:var(--surface-2);color:var(--ink);font:700 13px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;border-left:var(--stroke-3) solid var(--accent);margin:14px 0 8px}
.pitch{background:var(--surface);padding:var(--space-5);clip-path:polygon(var(--cut-lg) 0,100% 0,100% 100%,0 100%,0 var(--cut-lg));position:relative}
label{display:block;font:600 14px/1.3 var(--font-body);margin-top:12px;color:var(--mut)}
input,select{width:100%;font:inherit;padding:10px;border:var(--stroke-2) solid var(--line-strong);border-radius:0;background:var(--surface-2);color:var(--ink);margin-top:4px}
button,.opt,h1,h2,h3,p{overflow-wrap:break-word}svg,img{max-width:100%}
/* tabelas */
.tbl{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:460px}
td,th{padding:6px 8px;border-bottom:var(--stroke-1) solid var(--line);text-align:left}
th{color:var(--mut);font:700 13px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase}
td.n{text-align:right;font-family:var(--font-display);font-weight:700}
.scr{max-height:max(160px,28vh);overflow:auto}.scr table,#rp table{min-width:0}
.cr{display:flex;gap:6px;align-items:center}
pre{white-space:pre-wrap;background:var(--surface-2);border-left:var(--stroke-3) solid var(--line-strong);padding:12px;font:inherit}
details{margin-top:14px}summary{cursor:pointer;font-weight:600}
.age{background:var(--surface-2);color:var(--ink);font:700 .75rem/1.4 var(--font-display);letter-spacing:.04em;padding:0 6px;border-radius:var(--radius-sm);box-shadow:inset 0 0 0 var(--stroke-1) var(--line-strong)}
.tlr{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:var(--stroke-1) solid var(--line)}
.ach{padding-left:18px;margin:6px 0}
/* trofeus (forma e letra, sem emoji) */
.tr{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-2)}
.tp{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 6px;background:var(--gold);color:var(--boot);font:800 italic .95rem/1 var(--font-display);transform:skewX(var(--slant));cursor:help}
.tp>*{display:block;transform:skewX(10deg)}
.trophy{display:block;width:max-content;margin:var(--space-3) auto;padding:6px 28px;background:var(--gold);color:var(--boot);font:900 italic 2.6rem/1 var(--font-display);text-transform:uppercase;transform:skewX(var(--slant));animation:pop .8s both}
/* escalacao: gramado, giz e etiquetas boot */
.lu{width:min(100%,calc((100vh - var(--hbh,0px) - 150px)*.667));margin:var(--space-2) auto 0}
.field{position:relative;overflow:hidden;container-type:inline-size;aspect-ratio:2/3;width:100%;margin:0;border:var(--stroke-2) solid var(--chalk);background:repeating-linear-gradient(180deg,var(--pitch) 0 24px,var(--pitch-alt) 24px 48px);display:flex;flex-direction:column;justify-content:space-around;padding:6px 4px}
.pr-pitch::before{top:-12cqw;width:24cqw;height:24cqw;margin-left:-12cqw}
.pr-pitch::after{left:16%;right:16%;height:24%}
.bench{background:var(--surface);border-top:0}
.bench h3{margin:0;padding:6px 10px;background:var(--surface-2);color:var(--mut);font:700 13px/1.2 var(--font-display);font-style:normal;letter-spacing:.12em;display:flex;justify-content:space-between}
.bp{display:flex;gap:10px;align-items:center;padding:7px 10px;border-bottom:var(--stroke-1) solid var(--line)}.bp:last-child{border:0}
.bp>div{min-width:0}.bp b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;font-size:.75rem;color:var(--mut)}.mt em{font-style:normal;font-weight:700;color:var(--ink)}

      while(evs.length&&evs[0].m<=mm){const e=evs.shift();e.us?a++:c++;const w=e.us?(atk.length?pk(atk).n:pk(p.squad).n):'Rival',tk=$('tk');if(tk)tk.insertAdjacentHTML('beforeend',`<li class='${e.us?'':'opp'}'><b class='mn'>${e.m}'</b><em>Gol</em> ${e.us?esc(w):'do '+esc(opp)}</li>`)}
      if(mm>=90){clearInterval(window.__mt);if(done)return;done=1;draw('FIM');p.kmc=(p.kmc||0)+1;pushGame(mkGame(res>0?'V':res<0?'D':'E',opp,home,gf,ga));const ft=$('ft');if(ft){ft.innerHTML=`<p><b>${res>0?'Vitória':res<0?'Derrota':'Empate'} por ${gf} a ${ga}.</b> ${adv?'Seu esquema anulou o do rival. ':''}${res>0?'A torcida foi ao delírio.':res<0?'O time sentiu o golpe.':'Jogo truncado, ponto dividido.'}</p><div class='fg'>${formHtml()}<span class='pr-over'>Últimos 5 · ${formNote()}</span></div><button class='big' id='nx'>Continuar</button>`;$('nx').onclick=finish}rp()}
      else draw(mm+"'")};
    draw("0'");
    if(matchMedia('(prefers-reduced-motion:reduce)').matches)step(90);
    else{window.__mt=setInterval(()=>{if(!$('sb')){clearInterval(window.__mt);return}step(++m)},45);$('sk').onclick=()=>step(90)}
  });
}
function neg(o,mid){

  const offs=[['Oferta baixa (-30%)',.7,pf-.25],['Oferta padrão',1,pf],['Oferta alta (+30%)',1.3,pf+.2]].map(([l,m,c])=>({l,pr:Math.max(1,Math.round(o.price*m)),c})).concat(sw.map(x=>({l:'Trocar por '+x.n+' (nível '+x.ovr+')',pr:Math.max(0,o.price-val(x)),c:pf+.1,sw:x})));
  app.innerHTML=`${hd()}<article class='pr-offer'><div class='pr-offer__head'>${crest(o.club,44)}<div><p class='pr-over'>Negociação · ${esc(o.club)}</p><h3 class='pr-up'>${nm(o)}</h3><p class='mut'>${o.pos}, nível ${o.ovr}, ${o.age} anos · salário €${wg(o)}m/ano</p></div><div class='pr-offer__ask'><p class='pr-over'>Pedido</p><b>€${o.price}M</b></div></div>${offs.map((f,i)=>`<button class='pr-choice' style='--i:${i}' data-o='${i}' ${p.cash<f.pr?'disabled':''}><span class='lb'>${f.sw?'Trocar por '+nm(f.sw)+' (nível '+f.sw.ovr+')':esc(f.l)}</span><span class='pr-choice__meta'><span class='pr-cost'><span>€${f.pr}M</span></span><span class='pr-chance'><u><s style='width:${Math.round(C(f.c,.1,.95)*100)}%'></s></u><b>${Math.round(C(f.c,.1,.95)*100)}%</b></span></span></button>`).join('')}<button class='ghost big' id='bk'>Desistir</button></article>`;
  $('bk').onclick=()=>{p.msg='Você desistiu de '+o.n+'.';preseason(0,mid)};
  app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
    const f=offs[+b.dataset.o];
    if(Math.random()<C(f.c,.1,.95)){p.cash-=f.pr;if(f.sw)sell(f.sw);p.squad.push(o);p.mor+=1;p.msg=o.n+' fechou com você!';if(p.squad.length>20)sell([...p.squad].sort((a,b)=>a.ovr-b.ovr)[0])}
    else p.msg=o.club+' recusou a proposta por '+o.n+'.';
    clampAll();preseason(0,mid);
  });
}
function result(){
  document.body.classList.remove('game');$('lp').hidden=true;$('rp').hidden=true;$('hb').hidden=true;
  const sn=p.hist.length,T=p.titles+p.cups,best=Math.min(...p.hist.map(h=>h.pos));
  const rating=p.titles>=6&&p.top>=4?'Lenda do banco':T>=5||(p.top>=4&&p.titles>=2)?'Mestre da prancheta':T>=2?'Treinador respeitado':sn>=8?'Carreira discreta':'Passagem apagada';
  const txt=`${p.name} (${p.nat}) virou: ${rating}\n${sn} temporadas, ${p.titles} ligas, ${p.cups} copas, ${p.sacks} demissões\nMaior clube: ${CL[p.top][0]}`;
  const st=[];p.hist.forEach(h=>{const l=st[st.length-1];if(l&&l.club==h.club)l.rows.push(h);else st.push({club:h.club,rows:[h]})});
  const tl=st.map(s=>{const r=s.rows,t=r.filter(x=>x.lg).length,c=r.filter(x=>x.cup).length;return `<div class='tlr'>${crest(s.club,40)}<div><b>${esc(s.club)}</b><div class='mut'>${r[0].age}-${r[r.length-1].age} anos · ${r.length} temporada(s) · melhor: ${Math.min(...r.map(x=>x.pos))}º${t?' · '+t+' liga(s)':''}${c?' · '+c+' copa(s)':''}</div></div></div>`}).join('');
  const first=p.tr[0],ach=[p.titles?p.titles+' título(s) de liga':'',p.cups?p.cups+' copa(s)':'',first?'Primeiro troféu aos '+first.a+' anos, no '+first.c:'Nenhum troféu na carreira','Maior clube: '+CL[p.top][0],'Melhor campanha: '+best+'º lugar',p.sacks?p.sacks+' demissão(ões)':'Nunca foi demitido'].filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('');
  app.innerHTML=`${p.tr.length?"<div class='trophy'>Fim de carreira</div>":''}<div class='head'>${crest(CL[p.top][0],72)}<div><h2>${esc(rating)}</h2><p class='mut'>${esc(p.name)} se aposentou aos ${p.age} anos.</p></div></div>
  <div class='stats'>${stat(sn,'temporadas')}${stat(p.titles,'ligas')}${stat(p.cups,'copas')}${stat(p.sacks,'demissões')}</div>
  <h2>Principais conquistas</h2><ul class='ach'>${ach}</ul>
  <h2 style='margin-top:18px'>Sala de troféus</h2><div class='tr'>${p.tr.map(t=>`<span class='tp' title='${t.t} · ${esc(t.c)} · ${t.a} anos'><span>${t.t=='Liga'?'L':'C'}</span></span>`).join('')||"<span class='mut' style='font-size:.9rem'>Vazia</span>"}</div>
  <h2 style='margin-top:18px'>Trajetória</h2>${tl}
  <pre style='margin-top:14px'>${esc(txt)}</pre>
  <div class='row2' style='margin-top:10px'><button id='cp'>Copiar resultado</button><button class='ghost' id='again'>Jogar de novo</button></div>
  <h2 style='margin-top:24px'>Temporada a temporada</h2><div class='tbl'><table>${TH}${p.hist.map(rowHtml).join('')}</table></div>`;
  $('again').onclick=setup;
  $('cp').onclick=async e=>{try{await navigator.clipboard.writeText(txt);e.target.textContent='Copiado!'}catch(err){e.target.textContent='Selecione o texto e copie'}};
}
const tipOf=x=>`<b>${esc(x.n)}</b>${AB[x.pos]} · ${x.age} anos · salário €${wg(x)}m<br>Nível ${x.ovr} · Potencial ${x.pot}${SK.map((k,i)=>{const v=C(x.ovr+x.bk[i],20,99);return `<div class='bar'><span>${k}</span><i style='width:${v}%'></i><span>${v}</span></div>`}).join('')}`;
const nm=x=>`<span class='tipw' tabindex='0' data-tip='${esc(tipOf(x))}'>${esc(x.n)}</span>`;
const tt=document.createElement('div');tt.id='tt';tt.hidden=true;document.body.appendChild(tt);
const showTip=e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(!el){tt.hidden=true;return}tt.innerHTML=el.dataset.tip;tt.hidden=false;const r=el.getBoundingClientRect(),h=tt.offsetHeight;tt.style.left=C(r.left,8,innerWidth-222)+'px';tt.style.top=(r.bottom+h+8>innerHeight?Math.max(8,r.top-h-6):r.bottom+6)+'px'};
['mouseover','focusin'].forEach(t=>document.addEventListener(t,showTip));
['mouseout','focusout','scroll'].forEach(t=>document.addEventListener(t,e=>{if(t=='scroll'||!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('[data-tip]'))tt.hidden=true},true));
function preseason(fresh,mid){
  if(fresh){p.pre.forEach(x=>{delete x.src;p.squad.push(x)});p.pre=[];p.spo=genSp();p.sp={};p.midDone=0;p.msg='';genMk();p.st=0;p.steps=['tat',...SL.map(s=>s.k),'mkt']}
  const cur=p.steps[p.st],sl=SL.find(x=>x.k==cur),last=p.st==p.steps.length-1,f=p.mf;
  let body='';
  if(cur=='tat')body=tacBody();
  else if(sl)body=`<h2>Patrocínio: ${sl.l}</h2><p class='mut'>Escolha uma proposta para seguir.</p>${p.spo[cur].map((o,i)=>`<button class='opt ${p.sp[cur]==o?'sel':''}' data-sp='${cur}:${i}'><b class='sb'><span>${esc(o.n)}</span><em class='chip'>€${o.v}m/ano</em></b><span>${o.b?'Variável: +€'+o.b+'m extra se terminar no top 6 (base menor)':'Valor fixo: sem risco'}</span></button>`).join('')}`;
  else{
    const sv=f.src=='Vender',al=sv?[...p.squad].filter(x=>!f.pos||x.pos==f.pos).sort((a,b)=>val(b)-val(a)):p.mk.filter(o=>o.src==f.src&&(!f.pos||o.pos==f.pos)),per=mob()?3:6,sig=f.src+'|'+f.pos;
    if(p.sig!==sig){p.sig=sig;p.pg=0}p.pg=C(p.pg||0,0,Math.max(0,Math.ceil(al.length/per)-1));
    const L=al.slice(p.pg*per,p.pg*per+per);
    body=`<h2>Mercado: ${sv?'vender':'comprar'}</h2><p>${esc(p.msg||'')}</p><div class='seg'><button class='${sv?'ghost':'sel'}' data-m='buy'>Comprar</button><button class='${sv?'sel':'ghost'}' data-m='sell'>Vender</button></div>${sv?`<p class='mut'>Elenco: ${p.squad.length} jogadores (mínimo 14). Escolha uma proposta para vender.</p>`:`<div class='row3'>${['Clubes','Livres','Pré-contrato'].map(k=>`<button class='${f.src==k?'sel':'ghost'}' data-t='${k}'>${k}</button>`).join('')}</div>`}<select id='pf'><option value=''>Todas as posições</option>${PS.map(k=>`<option ${f.pos==k?'selected':''}>${k}</option>`).join('')}</select>${L.length?L.map(o=>sv?sellBtn(o):`<button class='opt' data-i='${p.mk.indexOf(o)}' ${p.cash<o.price?'disabled':''}><b>${nm(o)}: ${o.pos}, ${o.age} anos, nível ${o.ovr}</b><span>${esc(o.club)} · ${o.src=='Clubes'?'€'+o.price+'m':o.src=='Livres'?'sem custo de transferência':'chega na próxima temporada'} · salário €${wg(o)}m</span></button>`).join(''):"<p class='mut'>Ninguém com esse filtro.</p>"}${al.length>per?`<div class='row2'><button class='ghost' data-pg='-1' ${p.pg?'':'disabled'}>‹ Anteriores</button><button class='ghost' data-pg='1' ${(p.pg+1)*per>=al.length?'disabled':''}>Próximos ›</button></div>`:''}`;
  }
  app.innerHTML=`${hd()}<span class='tag'>${mid?'Janela de meio de temporada':'Pré-temporada'} · etapa ${p.st+1} de ${p.steps.length} · ${{tat:'Tática',master:'Master',kit:'Esportivo',mkt:'Mercado'}[cur]}</span><div class='steps'>${p.steps.map((k,i)=>`<i class='${i<=p.st?'on':''}'></i>`).join('')}</div>${body}<div class='row2' style='margin-top:18px'>${p.st?"<button class='ghost' id='bk'>Voltar</button>":'<span></span>'}<button id='nx' ${sl&&!p.sp[cur]?'disabled':''}>${last?(mid?'Voltar à temporada':'Começar temporada'):'Continuar'}</button></div>`;
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{p.style=b.dataset.s;preseason(0,mid)});
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{p.tg=b.dataset.g;preseason(0,mid)});
  app.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{const [k,i]=b.dataset.sp.split(':');p.sp[k]=p.spo[k][+i];p.st++;preseason(0,mid)});
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{p.mf.src=b.dataset.t;preseason(0,mid)});
  if($('pf'))$('pf').onchange=e=>{p.mf.pos=e.target.value;preseason(0,mid)};
  app.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{p.pg+=+b.dataset.pg;preseason(0,mid)});
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{p.mf.src=b.dataset.m=='sell'?'Vender':'Clubes';preseason(0,mid)});
  app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const x=p.squad[+b.dataset.v],of=x.of;if(p.squad.length<=14)return;sell(x);p.cash+=of.v;p.mor-=x.ovr>=base(p.tier)+8?3:1;p.msg=x.n+' vendido ao '+of.c+' por €'+of.v+'m.';clampAll();preseason(0,mid)});
  app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    const o=p.mk.splice(+b.dataset.i,1)[0];
    if(o.src=='Pré-contrato'){p.pre.push(o);p.msg=o.n+' assinou pré-contrato e chega na próxima temporada.'}
    else if(o.src=='Clubes'){return neg(o,mid)}
    else{p.cash-=o.price;p.mor+=1;p.squad.push(o);p.msg=o.n+' contratado!';if(p.squad.length>20)sell([...p.squad].sort((a,b)=>a.ovr-b.ovr)[0])}
    clampAll();preseason(0,mid);

  $('nx').onclick=()=>{

    if(mid){ev();return}
    p.nt=[];const n=[R(1,2),R(2,3),R(4,5)][p.mode];p.q=[...EVS].sort(()=>Math.random()-.5).slice(0,n);p.en=0;p.mq=Array(p.mode==2?3:p.mode?1:0).fill(0);p.kb=0;p.half=p.mode?Math.ceil(n/2):0;ev();
  };
}
const tier=o=>o>=85?'elite':o>=75?'gold':o>=65?'silver':'bronze';
const nm2=k=>k.replace(/ \d-\d(-\d)*$/,'');
const TG={'4':['Equilibrado','Ofensivo','Posse','Contra-ataque'],'3':['Alas 3-5-2','Pressão 3-4-3'],'5':['Defensivo','Retranca 5-4-1']};
const TGL={'4':'4 defensores','3':'3 zagueiros','5':'5 defensores'};
function fit(k){const o=p.style;p.style=k;const s=Math.round(str()+ST[k][0]);p.style=o;return s}
function tacBody(){
  const g=p.tg=p.tg||Object.keys(TG).find(x=>TG[x].includes(p.style)),all=Object.keys(ST),fs={};
  all.forEach(k=>fs[k]=fit(k));
  const best=all.reduce((a,k)=>fs[k]>fs[a]?k:a,all[0]),bar=(l,v)=>`<div class='mb'><span>${l}</span><i><u style='width:${C(v,5,100)}%'></u></i></div>`;
  return `<h2>Esquema tático</h2><p class='mut'>Como seu time vai jogar. A escalação ao lado se atualiza na hora.</p><div class='seg'>${Object.keys(TG).map(x=>`<button class='${x==g?'sel':'ghost'}' data-g='${x}'>${TGL[x]}</button>`).join('')}</div>${`<div class='pr-tactics'>${TG[g].map(k=>tacCard(k,{sel:p.style==k,fs:fs[k],best:k==best})).join('')}</div>`}`;
}
function sellBtn(o){
  o.of=o.of||{c:pk([...CL.flat(),...XC]),v:Math.max(1,Math.round(val(o)*(.8+Math.random()*.5)))};
  const min=p.squad.length<=14;
  return `<button class='opt' data-v='${p.squad.indexOf(o)}' ${min?'disabled':''}><b class='sb'><span>${nm(o)}</span><em class='chip'>+€${o.of.v}m</em></b><span>${AB[o.pos]} · ${o.age} anos · nível ${o.ovr} · proposta do ${esc(o.of.c)}${min?' · elenco mínimo (14)':''}</span></button>`;
}
function finB(){const w=p.squad.reduce((t,x)=>t+wg(x),0),sp=SL.reduce((t,s)=>t+(p.sp&&p.sp[s.k]?p.sp[s.k].v:0),0),rv=8+p.tier*4.5;return{rv,sp,w,net:rv+sp-w}}

const mob=()=>matchMedia('(max-width:820px)').matches;
const nav=document.createElement('nav');nav.id='nav';nav.className='pr-tabs';nav.innerHTML=[['main','Jogo'],['team','Time']].map(([k,l])=>`<button data-tab='${k}'><span>${l}</span></button>`).join('');document.body.appendChild(nav);
